<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zepto - 10 Minutes Delivery</title>
  <link rel="stylesheet" href="./Cart.css">
  <link rel="shortcut icon" href="./assets/zepto-favicon.webp" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <!-- !NAVBAR -->
  <nav>
    <section id="nav1">
      <aside id="logo-address">
        <div id="logo">
          Z
        </div>
        <div id="address">
          <p>Delivery in <span>10 mins</span></p>
          <p id="location"><i class="fa-solid fa-location-dot"></i> Select Address</p>
        </div>
      </aside>
      <aside id="links">
        <a href="./index.html">Home</a>
        <a href="./Products.html">Products</a>
      </aside>
      <aside id="user-cart">
        <i class="fa-solid fa-user"></i>
        <i class="fa-solid fa-cart-shopping" onclick="location.assign('./Cart.html')"></i>
      </aside>
    </section>
  </nav>
  <!-- !SECTION -->
  <main class="cart_container">
    <section class="cart_container_one">
      <h2>My Cart</h2>
      <p>⚡ Delivery in 10 minutes to Home · MG Road, Bengaluru</p>
    </section>
    <section class="cart_container_two">

    </section>
    <section class="cart_container_three">
      <div class="billing_details">
        <h3>Bill Details</h3>
        <div class="billing_info">
          <p>Item Total (5)</p>
          <p>$850</p>
        </div>
        <div class="billing_info">
          <p>Delivery Charges</p>
          <p>$850</p>
        </div>
        <div class="billing_info">
          <p>Platform Fee</p>
          <p>$850</p>
        </div>
        <div class="billing_info">
          <p>Discount</p>
          <p>$850</p>
        </div>
        <div class="billing_info">
          <h3>Grand Total</h3>
          <p>$850</p>
        </div>
      </div>
      <button id="buyNowBtn">Buy Now</button>
    </section>
  </main>
  <script src="./Cart.js"></script>
  <script src="./Order.js"></script>
</body>
</html>
