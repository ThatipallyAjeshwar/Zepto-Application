<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zepto - 10 Minutes Delivery</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="shortcut icon" href="./assets/zepto-favicon.webp" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <!-- !NAVBAR -->
  <nav>
    <section id="nav1">
      <aside id="logo-address">
        <div id="logo">
          Z
        </div>
        <div id="address">
          <p>Delivery in <span>10 mins</span></p>
          <p id="location"><i class="fa-solid fa-location-dot"></i> Select Address</p>
        </div>
      </aside>
      <aside id="links">
        <a href="#" class="active">Home</a>
        <a href="./Products.html">Products</a>
      </aside>
      <aside id="user-cart">
        <i class="fa-regular fa-user"></i>
        <i class="fa-solid fa-cart-shopping"></i>
      </aside>
    </section>
  </nav>
  <!-- !HEADER -->
  <header>
    <div id="banner-container">
      <img src="./images (1).jpg" alt="banner1">
      <img src="./images.jpg" alt="banner2">
      <img src="./Zepto-Success-Story-StartupTalky.jpg" alt="banner3">
    </div>
  </header>
  <!-- !CATEGORY -->
   <section id="category">
    <article id="category-title">
      <h2>Shop by Category</h2>
    </article>
    <article id="category-items">
    </article>
   </section>
  <script src="./script.js"></script>
</body>
</html>
